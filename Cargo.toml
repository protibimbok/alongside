[package]
name = "concurtui"
version = "0.1.0"
edition = "2024"
description = "Run several commands in parallel and switch between their output in a TUI"
license = "MIT"
repository = "https://github.com/protibimbok/concurtui"
keywords = ["tui", "parallel", "terminal", "concurrently", "cli"]
categories = ["command-line-utilities"]
include = ["/src", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
tui-term = "0.3.4"
vt100 = "0.16.2"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
